<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Итоговый тест · Химия 11</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <script src="assets/main.js"></script>
</head>
<body data-page="quiz">
<header id="site-header"></header>

<main class="container" style="max-width:820px;padding-top:28px;padding-bottom:60px">
  <span class="badge">Проверка знаний</span>
  <h1>Итоговый тест</h1>
  <p class="lead">Выберите раздел или проходите тест по всему курсу. После каждого ответа появится пояснение.</p>

  <div class="card">
    <div class="quiz-bar">
      <select id="section">
        <option value="all">Все разделы</option>
        <option value="1">1. Строение атома</option>
        <option value="2">2. Строение вещества</option>
        <option value="3">3. Химические реакции</option>
        <option value="4">4. Неорганическая химия</option>
        <option value="5">5. Химия и жизнь</option>
      </select>
      <button class="btn" id="restart">Начать заново</button>
      <span class="score" id="score" style="margin-left:auto"></span>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div id="quiz"></div>
  <div class="card" id="final" style="display:none;text-align:center"></div>
</main>

<footer id="site-footer"></footer>
<script>
(function () {
  const Q = [
    // --- Раздел 1 ---
    { s: 1, q: "Сколько нейтронов в атоме ³⁹K?", o: ["19", "20", "39", "58"], a: 1, e: "N = A − Z = 39 − 19 = 20." },
    { s: 1, q: "Какая электронная формула соответствует атому хлора?", o: ["1s² 2s² 2p⁶ 3s² 3p⁵", "1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁵", "1s² 2s² 2p⁶ 3s¹"], a: 0, e: "У хлора Z = 17: 2 + 2 + 6 + 2 + 5 = 17 электронов." },
    { s: 1, q: "Какой элемент относится к d-элементам?", o: ["Ca", "Al", "Fe", "S"], a: 2, e: "У железа заполняется 3d-подуровень предвнешнего уровня." },
    { s: 1, q: "Как изменяется радиус атома в периоде слева направо?", o: ["Увеличивается", "Уменьшается", "Не изменяется", "Сначала растёт, потом падает"], a: 1, e: "Заряд ядра растёт при том же числе уровней — электроны притягиваются сильнее, атом сжимается." },
    { s: 1, q: "Современная формулировка периодического закона связывает свойства элементов с…", o: ["атомной массой", "числом нейтронов", "зарядом ядра атома", "плотностью простых веществ"], a: 2, e: "Менделеев опирался на атомный вес, но физический смысл периодичности — заряд ядра." },
    { s: 1, q: "Номер периода показывает…", o: ["число внешних электронов", "число энергетических уровней", "высшую степень окисления", "число нейтронов"], a: 1, e: "Например, у Na (3-й период) три энергетических уровня." },
    { s: 1, q: "Электронная формула хрома (с учётом «провала» электрона):", o: ["[Ar] 3d⁴ 4s²", "[Ar] 3d⁵ 4s¹", "[Ar] 3d⁶", "[Ar] 4s² 4p⁴"], a: 1, e: "Наполовину заполненный d⁵-подуровень устойчивее, поэтому один электрон переходит с 4s на 3d." },

    // --- Раздел 2 ---
    { s: 2, q: "Какой тип связи в молекуле HCl?", o: ["Ионная", "Ковалентная неполярная", "Ковалентная полярная", "Металлическая"], a: 2, e: "Связь между разными неметаллами; электронная пара смещена к хлору." },
    { s: 2, q: "Какое вещество имеет атомную кристаллическую решётку?", o: ["NaCl", "SiO₂", "CO₂", "I₂"], a: 1, e: "Кварц SiO₂ — атомная решётка; поэтому он твёрдый и тугоплавкий, в отличие от молекулярного CO₂." },
    { s: 2, q: "Ион аммония NH₄⁺ образуется по механизму…", o: ["обменному", "донорно-акцепторному", "ионному", "металлическому"], a: 1, e: "Азот предоставляет неподелённую электронную пару, а H⁺ — свободную орбиталь." },
    { s: 2, q: "Высокая температура кипения воды объясняется…", o: ["ионной связью", "водородными связями между молекулами", "металлической связью", "атомной решёткой"], a: 1, e: "Водородные связи между молекулами H₂O требуют дополнительной энергии на разрыв." },
    { s: 2, q: "Сокращённое ионное уравнение Ba²⁺ + SO₄²⁻ → BaSO₄↓ соответствует реакции:", o: ["BaCO₃ + H₂SO₄", "BaCl₂ + Na₂SO₄", "Ba(OH)₂ + SO₃", "BaO + H₂SO₄"], a: 1, e: "Только в этом случае оба исходных вещества — растворимые сильные электролиты." },
    { s: 2, q: "Какая среда в растворе Na₂CO₃?", o: ["Кислая", "Нейтральная", "Щелочная", "Зависит от температуры"], a: 2, e: "Соль сильного основания и слабой кислоты — гидролиз по аниону, образуются ионы OH⁻." },
    { s: 2, q: "Массовая доля соли в растворе из 20 г соли и 180 г воды равна:", o: ["10 %", "11,1 %", "20 %", "18 %"], a: 0, e: "ω = 20 / (20 + 180) = 0,1 = 10 %." },
    { s: 2, q: "Эффект Тиндаля характерен для…", o: ["истинных растворов", "коллоидных растворов", "чистых веществ", "газовых смесей"], a: 1, e: "Коллоидные частицы (1–100 нм) рассеивают свет, и луч становится видимым." },
    { s: 2, q: "Гидролизу НЕ подвергается соль:", o: ["NH₄Cl", "K₂S", "KNO₃", "ZnSO₄"], a: 2, e: "KNO₃ образован сильным основанием и сильной кислотой." },

    // --- Раздел 3 ---
    { s: 3, q: "Во сколько раз возрастёт скорость реакции при нагревании на 30 °C, если γ = 2?", o: ["в 6 раз", "в 8 раз", "в 9 раз", "в 3 раза"], a: 1, e: "2^(30/10) = 2³ = 8." },
    { s: 3, q: "Как сместится равновесие N₂ + 3H₂ ⇄ 2NH₃ + Q при повышении давления?", o: ["Вправо", "Влево", "Не сместится", "Реакция остановится"], a: 0, e: "Слева 4 моль газов, справа 2 — давление смещает равновесие в сторону меньшего объёма." },
    { s: 3, q: "Катализатор…", o: ["смещает равновесие вправо", "смещает равновесие влево", "не смещает равновесие", "увеличивает выход продукта"], a: 2, e: "Катализатор ускоряет и прямую, и обратную реакции одинаково." },
    { s: 3, q: "В реакции Zn + CuSO₄ → ZnSO₄ + Cu восстановителем является:", o: ["Cu²⁺", "Zn⁰", "SO₄²⁻", "Cu⁰"], a: 1, e: "Цинк отдаёт электроны: Zn⁰ − 2e⁻ → Zn²⁺." },
    { s: 3, q: "Продукт восстановления KMnO₄ в кислой среде:", o: ["MnO₂", "K₂MnO₄", "Mn²⁺", "Mn"], a: 2, e: "В кислой среде Mn⁺⁷ восстанавливается до Mn⁺², раствор обесцвечивается." },
    { s: 3, q: "Какое вещество выделяется на катоде при электролизе раствора NaCl?", o: ["Na", "Cl₂", "H₂", "O₂"], a: 2, e: "Натрий — активный металл, поэтому на катоде восстанавливается вода: 2H₂O + 2e⁻ → H₂ + 2OH⁻." },
    { s: 3, q: "При электролизе раствора CuSO₄ с инертными электродами на аноде выделяется:", o: ["SO₂", "O₂", "H₂", "Cu"], a: 1, e: "Сульфат-ион кислородсодержащий, окисляется вода: 2H₂O − 4e⁻ → O₂ + 4H⁺." },
    { s: 3, q: "Реакция 2KClO₃ → 2KCl + 3O₂ относится к ОВР типа:", o: ["межмолекулярная", "внутримолекулярная", "диспропорционирование", "не является ОВР"], a: 1, e: "Окислитель (Cl⁺⁵) и восстановитель (O⁻²) — разные элементы в одной молекуле." },

    // --- Раздел 4 ---
    { s: 4, q: "Какой металл вытеснит медь из раствора CuSO₄?", o: ["Ag", "Hg", "Fe", "Au"], a: 2, e: "Железо стоит левее меди в ряду активности." },
    { s: 4, q: "С раствором щёлочи реагирует:", o: ["Fe", "Cu", "Al", "Mg"], a: 2, e: "Алюминий — амфотерный металл: 2Al + 2NaOH + 6H₂O → 2Na[Al(OH)₄] + 3H₂." },
    { s: 4, q: "Пассивируется холодной концентрированной HNO₃:", o: ["Cu", "Fe", "Ag", "Zn"], a: 1, e: "Fe, Al и Cr покрываются прочной оксидной плёнкой." },
    { s: 4, q: "Качественный реактив на ион Fe³⁺:", o: ["AgNO₃", "BaCl₂", "KSCN", "HCl"], a: 2, e: "Роданид калия даёт кроваво-красное окрашивание." },
    { s: 4, q: "Белый осадок, нерастворимый в кислотах, с BaCl₂ даёт ион:", o: ["Cl⁻", "SO₄²⁻", "NO₃⁻", "CO₃²⁻"], a: 1, e: "BaSO₄ не растворяется в кислотах; BaCO₃ — растворяется с выделением газа." },
    { s: 4, q: "Пламя окрашивается в фиолетовый цвет ионами:", o: ["Na⁺", "Li⁺", "K⁺", "Ca²⁺"], a: 2, e: "K — фиолетовый, Na — жёлтый, Li — карминово-красный, Ca — кирпично-красный." },
    { s: 4, q: "Наиболее сильный окислитель среди галогенов:", o: ["F₂", "Cl₂", "Br₂", "I₂"], a: 0, e: "Окислительная способность галогенов ослабевает сверху вниз по группе." },
    { s: 4, q: "Сплав меди и цинка называется:", o: ["бронза", "латунь", "мельхиор", "дюралюминий"], a: 1, e: "Бронза — Cu + Sn, мельхиор — Cu + Ni, дюралюминий — сплав на основе Al." },
    { s: 4, q: "При протекторной защите стальной конструкции используют:", o: ["медь", "олово", "цинк", "серебро"], a: 2, e: "Протектор должен быть активнее железа — тогда разрушается он, а не сталь." },

    // --- Раздел 5 ---
    { s: 5, q: "Катализатор окисления SO₂ в SO₃ при производстве серной кислоты:", o: ["Fe", "Pt", "V₂O₅", "MnO₂"], a: 2, e: "В современном контактном способе используется оксид ванадия(V)." },
    { s: 5, q: "SO₃ в производстве серной кислоты поглощают…", o: ["водой", "концентрированной H₂SO₄", "раствором щёлочи", "аммиаком"], a: 1, e: "Водой — нельзя: образуется сернокислотный туман. Получают олеум." },
    { s: 5, q: "Принцип циркуляции применяется в производстве…", o: ["чугуна", "аммиака", "стекла", "цемента"], a: 1, e: "Непрореагировавшие N₂ и H₂ возвращают в колонну синтеза." },
    { s: 5, q: "Восстановитель железа в доменной печи:", o: ["CO₂", "CO", "O₂", "CaCO₃"], a: 1, e: "Угарный газ образуется из кокса и восстанавливает оксиды железа." },
    { s: 5, q: "Сталь отличается от чугуна…", o: ["большим содержанием углерода", "меньшим содержанием углерода (< 2,14 %)", "отсутствием железа", "содержанием алюминия"], a: 1, e: "Передел чугуна в сталь — это выжигание избытка углерода и примесей." },
    { s: 5, q: "Главная причина кислотных дождей:", o: ["CO₂ и CH₄", "SO₂ и оксиды азота", "фреоны", "O₃"], a: 1, e: "В атмосфере они превращаются в серную и азотную кислоты." },
    { s: 5, q: "Полиэтилен получают реакцией…", o: ["поликонденсации", "полимеризации", "гидролиза", "этерификации"], a: 1, e: "nCH₂=CH₂ → (−CH₂−CH₂−)ₙ, без побочных продуктов." },
    { s: 5, q: "Какой принцип «зелёной химии» описывает стремление включить в продукт максимум атомов исходных веществ?", o: ["Катализ", "Атомная экономия", "Возобновляемое сырьё", "Предотвращение аварий"], a: 1, e: "Атомная экономия = M(продукта) / ΣM(реагентов) · 100 %." }
  ];

  const $ = id => document.getElementById(id);
  let list = [], answered = 0, correct = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const NAMES = { 1: "Строение атома", 2: "Строение вещества", 3: "Химические реакции", 4: "Неорганическая химия", 5: "Химия и жизнь" };

  function render() {
    const sec = $("section").value;
    list = shuffle(Q.filter(q => sec === "all" || String(q.s) === sec));
    answered = 0; correct = 0;
    $("final").style.display = "none";
    const box = $("quiz"); box.innerHTML = "";
    list.forEach((item, i) => {
      const card = document.createElement("div");
      card.className = "card quiz-q";
      const order = shuffle(item.o.map((t, k) => ({ t, k })));
      card.innerHTML = '<div class="q-meta">Вопрос ' + (i + 1) + " из " + list.length + " · " + NAMES[item.s] + "</div><h3>" + item.q + '</h3><div class="opts"></div><div class="explain"></div>';
      const opts = card.querySelector(".opts");
      order.forEach(({ t, k }) => {
        const b = document.createElement("button");
        b.className = "opt"; b.textContent = t;
        b.onclick = () => choose(card, b, k === item.a, item);
        b.dataset.right = k === item.a ? "1" : "";
        opts.appendChild(b);
      });
      box.appendChild(card);
    });
    update();
  }
  function choose(card, btn, ok, item) {
    card.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if (b.dataset.right) b.classList.add("correct");
    });
    if (!ok) btn.classList.add("wrong");
    const ex = card.querySelector(".explain");
    ex.innerHTML = (ok ? "✅ <b>Верно.</b> " : "❌ <b>Неверно.</b> ") + item.e;
    ex.classList.add("show");
    answered++; if (ok) correct++;
    update();
    if (answered === list.length) finish();
  }
  function update() {
    $("score").textContent = "Правильно: " + correct + " / " + answered;
    $("bar").style.width = (list.length ? answered / list.length * 100 : 0) + "%";
  }
  function finish() {
    const p = Math.round(correct / list.length * 100);
    let grade = p >= 85 ? "Отлично! 🎉" : p >= 65 ? "Хорошо! 👍" : p >= 45 ? "Удовлетворительно — стоит повторить темы." : "Нужно повторить материал 📚";
    const f = $("final");
    f.innerHTML = "<h2 style='margin-top:0'>Результат: " + correct + " из " + list.length + " (" + p + " %)</h2><p>" + grade + "</p><button class='btn' onclick='window.scrollTo({top:0,behavior:\"smooth\"})'>Наверх</button>";
    f.style.display = "block";
  }
  $("section").addEventListener("change", render);
  $("restart").addEventListener("click", render);
  render();
})();
</script>
</body>
</html>
